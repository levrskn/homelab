services:
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    user: root
    network_mode: host
    pid: host
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - /:/host:ro,rslave
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro

    command:
      - "--path.rootfs=/host"
      - "--collector.systemd"
      - "--collector.processes"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"

# No ports section needed with network_mode: host (listens on :9100 directly)
# Please make sure you know what are you doing with exposing container or run with root level.
# For production it is recomended to give least privilegies and use authentication.
